services:
  web:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "serve.py"]
    ports:
      - "3000:80"
    volumes:
      - ./:/app:ro
    environment:
      - BASE44_PREVIEW_MODE
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost/', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: on-failure
